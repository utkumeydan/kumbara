name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (tip kontrolü + testler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mobile:
    name: Mobil (tip kontrolü + lint + expo-doctor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint app components lib widgets
      # Expo yeni yama sürümü yayımlayınca sürüm farkı uyarısı verir; bu, CI'yi düşürmez, uyarı olarak görünür
      - name: Expo bağımlılık kontrolü (uyarı)
        run: npx expo-doctor
        continue-on-error: true

  e2e:
    name: Uçtan uca (Playwright, web)
    runs-on: ubuntu-latest
    needs: [api, mobile]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/mobile
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker imajları derleniyor
    runs-on: ubuntu-latest
    needs: [api, mobile]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kumbara-api apps/api
      - run: docker build -t kumbara-web apps/mobile

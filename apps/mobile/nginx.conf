server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # API aynı alan adı üzerinden sunulur; ayrı alan adı ve CORS gerekmez
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Güvenlik başlıkları her konumda ayrıca eklenir (nginx, konumdaki add_header varken üst seviyedekileri devralmaz)
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
  # Sayfa önbelleğe alınmaz; güncellemeden sonra yeni sürüm hemen yüklenir (kod dosyaları adlarındaki özetle önbelleklenir)
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
